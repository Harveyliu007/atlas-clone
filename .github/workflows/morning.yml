name: Atlas Morning Brief

on:
  schedule:
    - cron: "0 23 * * 1-5"   # UTC 23:00 = 北京时间 晨报（07:00）
  workflow_dispatch: {}      # 支持手动触发

permissions:
  contents: write   # 允许提交生成结果
  id-token: write   # Pages 部署
  pages: write

concurrency:
  group: ${{ github.workflow }}   # 同一工作流禁止并发运行，避免提交竞争
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 晨报（07:00）生成
        run: node src/generate.js daily
        env:
          ATLAS_LLM_API_KEY: ${{ secrets.ATLAS_LLM_API_KEY }}   # 可选：不配则自动用启发式引擎
      - name: 提交生成结果
        run: |
          git config user.name "Atlas Bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add public _data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "晨报（07:00）: $(date -u +%Y-%m-%d)"
          fi
          git pull --rebase -X ours origin main
          git push
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: 部署 Pages
        uses: actions/deploy-pages@v4
