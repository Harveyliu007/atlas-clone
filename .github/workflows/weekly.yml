name: Atlas Weekly Review

on:
  schedule:
    - cron: "0 22 * * 6"   # UTC 22:00 = 北京时间 周报（周六 06:00）
  workflow_dispatch: {}      # 支持手动触发

permissions:
  contents: write   # 允许提交生成结果
  id-token: write   # Pages 部署
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 周报（周六 06:00）生成
        run: node src/generate.js weekly
        env:
          ATLAS_LLM_API_KEY: ${{ secrets.ATLAS_LLM_API_KEY }}   # 可选：不配则自动用启发式引擎
      - name: 提交生成结果
        run: |
          git config user.name "Atlas Bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add public _data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "周报（周六 06:00）: $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: 部署 Pages
        uses: actions/deploy-pages@v4
